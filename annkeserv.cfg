
# annkeserv -- browse the camera archive over HTTP.
# Installed as /etc/default/annkeserv; a per-host annkeserv.<hostname>.cfg is used instead when present.

# camera-<name>=<directory>, in selector order: day subdirectories (annkepull) or top-level daily files (timelapse)
#camera-front=/opt/storage/camera/front

# detections-<name>=<directory>: a camera's detections, as annkescan-realtime keeps them (<YYYYMMDD>/<YYYYMMDDHHMMSS>.jpg,
# in UTC): its calendar marks the days with any, and a day's page lists them after its files
#detections-wide=/opt/storage/weather/detections

port=8088

# basic auth (blank user); an empty password means no login
username=
password=
